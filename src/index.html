<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="#" />
    <meta name="keywords" content="#" />
    <meta name="description" content="#" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="" alt="Spots logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-button">
              <img
                src=""
                alt="Edit avatar pencil logo"
                class="profile__avatar-pencil-logo"
              />
            </button>
            <img src="" alt="Bessie Coleman" class="profile__image" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-button">
              <img
                src=""
                alt="Edit Profile pencil logo"
                class="profile__pencil-logo"
              />
              Edit Profile
            </button>
          </div>
          <button type="button" class="profile__post-button">
            <img src="" alt="New Post add logo" class="profile__add-logo" />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card__list-item">
                <img src="" alt="" class="card__image" />
                <button type="button" class="card__discard-button"></button>
                <div class="card__content">
                  <h2 class="card__description"></h2>
                  <button type="button" class="card__button"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyright">2025 © Genevive Castro</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="" alt="Exit logo" class="modal__exit-logo" />
          </button>
          <h2 class="modal__title">Edit profile</h2>
          <form id="edit-profile" class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                name="name"
                placeholder="Type your name"
                required
                minlength="2"
                maxlength="40"
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                name="description"
                placeholder="Describe yourself"
                required
                minlength="2"
                maxlength="200"
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="add-card-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-button">
            <img src="" alt="Exit logo" class="modal__exit-logo" />
          </button>
          <h2 class="modal__title">New post</h2>
          <form id="new-post" class="add-card-form modal__form" novalidate>
            <label for="add-card-link-input" class="modal__label">
              Image link
              <input
                id="add-card-link-input"
                type="url"
                class="modal__input"
                name="link"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="add-card-link-input-error" class="modal__error"></span>
            </label>
            <label for="add-card-name-input" class="modal__label">
              Caption
              <input
                id="add-card-name-input"
                type="text"
                class="modal__input"
                name="name"
                placeholder="Type your caption"
                required
                minlength="2"
                maxlength="30"
              />
              <span id="add-card-name-input-error" class="modal__error"></span>
            </label>
            <button type="submit" class="modal__submit-button">Save</button>
          </form>
        </div>
      </div>
    </div>
    <div class="modal" id="preview-modal">
      <div class="modal__container modal__container_type_preview">
        <button
          type="button"
          class="modal__close-button modal__close-button_type_preview"
        ></button>
        <img class="modal__image" src="" alt="" />
        <p class="modal__caption"></p>
      </div>
    </div>
    <div class="modal" id="delete-card-modal">
      <div class="modal__container modal__container_type_delete">
        <h2 class="modal__title modal__title_delete">
          Are you sure you want to delete this image?
        </h2>
        <form
          id="delete-form"
          class="modal__form modal__form_delete"
          novalidate
        >
          <button
            type="submit"
            class="modal__submit-button modal__submit-button_type_delete"
          >
            Delete
          </button>
          <button
            type="button"
            class="modal__submit-button modal__submit-button_type_cancel"
          >
            Cancel
          </button>
        </form>
        <button
          type="button"
          class="modal__close-button modal__close-button_type_close"
        ></button>
      </div>
    </div>
  </body>
</html>
